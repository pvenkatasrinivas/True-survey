# ============================================================
# True Survey backend configuration
# Values in ${...} come from environment variables; the part after ":" is the default.
# DB_PASSWORD has NO default on purpose - set it before starting (see README.md).
# ============================================================

server.port=${PORT:8081}

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/truesurvey}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" lets Hibernate create the tables from the @Entity classes (see database/schema.sql).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Swagger / OpenAPI ----------
# Swagger UI:   http://localhost:8081/swagger-ui.html
# OpenAPI JSON: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---------- CORS ----------
# Comma-separated list of frontend URLs allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
