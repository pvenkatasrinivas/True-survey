# Used only by tests (@ActiveProfiles("test")): in-memory H2 database, so tests run
# without PostgreSQL and every run starts with empty tables.
spring.datasource.url=jdbc:h2:mem:truesurvey_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.cors.allowed-origins=http://localhost:5174
